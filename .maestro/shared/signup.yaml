appId: ${APP_ID}
env:
  STAGING_HOMESERVER: ufibwbmed6jeq9k4p583go95wofakh9fwpp4k734trq79pd9u1uy
  PUBKY_NAME: Staging Test Pubky
---
- runScript: ../scripts/request-invite-code.js
# Release builds seed production, so make staging available through Settings first.
- tapOn:
    id: HomeHeaderSettingsButton
- tapOn:
    id: ManageHomeserversButton
- runFlow:
    when:
      notVisible:
        id: HomeserverRename-${STAGING_HOMESERVER}
    commands:
      - tapOn:
          id: HomeserversAddButton
      - tapOn:
          id: AddServerLabelInput
      - inputText: Staging
      - tapOn:
          id: AddServerHomeserverInput
      - inputText: ${STAGING_HOMESERVER}
      - runFlow: dismiss-server-form-keyboard.yaml
      - tapOn:
          id: AddServerSaveButton
- tapOn:
    id: AppHeaderBackButton
- tapOn:
    id: AppHeaderBackButton
- assertVisible:
    id: PubkyBox--0-ActionButton
- tapOn:
    id: PubkyBox--0-ActionButton
- waitForAnimationToEnd
- assertVisible:
    id: EditPubkyNameInput
- tapOn:
    id: EditPubkyNameInput
- inputText: ${PUBKY_NAME}
- assertVisible: ${PUBKY_NAME}
- extendedWaitUntil:
    visible:
      id: EditPubkySelectServerButton
    timeout: 120000
- tapOn:
    id: EditPubkySelectServerButton
- tapOn:
    id: SelectServer-${STAGING_HOMESERVER}
- tapOn:
    id: EditPubkyInviteCodeInput
- inputText: ${output.INVITE_CODE_WITHOUT_HYPHENS}
- tapOn:
    id: EditPubkyHomeserverLabel
- tapOn:
    id: EditPubkySaveButton
- extendedWaitUntil:
    visible:
      id: PubkyBox-StagingTestPubky-0
    timeout: 120000
